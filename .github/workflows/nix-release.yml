name: Build Nix release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v prefix)"
        required: true
        default: "0.0.24-fork.1"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      T3CODE_MOBILE_APP_NAME: T3 Code Fork
      T3CODE_MOBILE_SCHEME: t3code-fork
      T3CODE_ANDROID_PACKAGE: com.kevinher7.t3code
      T3CODE_ANDROID_VERSION_CODE: ${{ github.run_number }}
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "T3CODE_MOBILE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing Android release keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android release keystore password}"
          keystore="$RUNNER_TEMP/t3code-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p release
          apk="release/T3-Code-${T3CODE_MOBILE_VERSION}-android.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias t3code \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$apk" \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/aapt" dump badging "$apk" | sed -n '1p'

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.apk
          fail_on_unmatched_files: true

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # electron-builder ad-hoc signs the entire unpacked node_modules tree
          # (asarUnpack: **/node_modules/**), opening a huge number of files at
          # once and tripping EMFILE. macOS caps per-process fds at
          # kern.maxfilesperproc, which `ulimit -n` alone cannot exceed, so raise
          # the kernel cap first, then the shell limit.
          sudo sysctl -w kern.maxfiles=1048576 kern.maxfilesperproc=1048576 || true
          ulimit -n 1048576 2>/dev/null || ulimit -n unlimited 2>/dev/null || true
          echo "fd limits -> soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          vp run dist:desktop:artifact \
            --platform mac \
            --target zip \
            --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --verbose

      - name: Build CLI
        run: vp run --filter t3 build

      - name: Package CLI tarball
        env:
          # Skip corepack's interactive "download this package manager?" prompt
          # so the pinned pnpm auto-installs non-interactively in CI.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          mkdir -p release
          # Produce a pruned production tree (bundle dist/ + only runtime deps)
          # instead of taring the full multi-GB node_modules. pnpm deploy resolves
          # the prod dependency closure for the `t3` package into a self-contained
          # dir containing dist/, node_modules/, and package.json.
          #
          # Vite+ embeds pnpm but does not expose a standalone `pnpm` on PATH, and
          # `corepack enable`'s shims do not land on PATH under the `vp` toolchain.
          # Invoke pnpm *through* corepack instead: it launches the repo's pinned
          # pnpm (the `packageManager` field) directly, bypassing PATH entirely.
          rm -rf cli-deploy
          corepack pnpm --filter t3 deploy --prod --legacy cli-deploy
          tar -czf release/t3code-cli-aarch64-darwin.tar.gz -C cli-deploy \
            node_modules \
            dist \
            package.json

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            release/T3-Code-*.zip
            release/t3code-cli-aarch64-darwin.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI
        run: vp run --filter t3 build

      - name: Package CLI tarball
        env:
          # Skip corepack's interactive "download this package manager?" prompt
          # so the pinned pnpm auto-installs non-interactively in CI.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          mkdir -p release
          # Produce a pruned production tree (bundle dist/ + only runtime deps)
          # instead of taring the full multi-GB node_modules. pnpm deploy resolves
          # the prod dependency closure for the `t3` package into a self-contained
          # dir containing dist/, node_modules/, and package.json.
          #
          # Vite+ embeds pnpm but does not expose a standalone `pnpm` on PATH, and
          # `corepack enable`'s shims do not land on PATH under the `vp` toolchain.
          # Invoke pnpm *through* corepack instead: it launches the repo's pinned
          # pnpm (the `packageManager` field) directly, bypassing PATH entirely.
          rm -rf cli-deploy
          corepack pnpm --filter t3 deploy --prod --legacy cli-deploy
          tar -czf release/t3code-cli-x86_64-linux.tar.gz -C cli-deploy \
            node_modules \
            dist \
            package.json

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release/t3code-cli-x86_64-linux.tar.gz

  update-hashes:
    needs: [build-android, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --dir artifacts \
            --pattern 't3code-cli-*.tar.gz' \
            --pattern 'T3-Code-*-arm64.zip' \
            --pattern 'T3-Code-*-android.apk'

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd artifacts && sha256sum -- *) > SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Compute hashes and write nix-hashes.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          CLI_DARWIN=$(nix hash file --sri --type sha256 artifacts/t3code-cli-aarch64-darwin.tar.gz)
          CLI_LINUX=$(nix hash file --sri --type sha256 artifacts/t3code-cli-x86_64-linux.tar.gz)
          DESKTOP=$(nix hash file --sri --type sha256 artifacts/T3-Code-*-arm64.zip)

          echo "version:        $VERSION"
          echo "cli linux:      $CLI_LINUX"
          echo "cli darwin:     $CLI_DARWIN"
          echo "desktop darwin: $DESKTOP"

          jq -n \
            --arg version "$VERSION" \
            --arg cli_linux "$CLI_LINUX" \
            --arg cli_darwin "$CLI_DARWIN" \
            --arg desktop "$DESKTOP" \
            '{
              version: $version,
              cli: {
                "x86_64-linux": $cli_linux,
                "aarch64-darwin": $cli_darwin
              },
              desktop: {
                "aarch64-darwin": $desktop
              }
            }' > nix-hashes.json

          cat nix-hashes.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix-hashes.json
          if git diff --cached --quiet; then
            echo "nix-hashes.json already up to date"
            exit 0
          fi
          git commit -m "chore(release): update artifact hashes for ${GITHUB_REF_NAME}"
          git push origin HEAD:personal
